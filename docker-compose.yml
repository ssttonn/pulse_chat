version: '3.8'

services:
  # ---------------------------------
  # INFRASTRUCTURE
  # ---------------------------------
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  nats:
    image: nats:latest
    ports:
      - "4222:4222"
      - "8222:8222" # monitoring port

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    ports:
      - "8000:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"

  kafka:
    image: apache/kafka:3.7.0
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # ---------------------------------
  # APPLICATIONS
  # ---------------------------------
  api-core:
    build: 
      context: .
      dockerfile: src/api-core/Dockerfile
    ports:
      - "${API_PORT}:8081"
    depends_on:
      - postgres
      - dynamodb-local

  edge-ws:
    build: 
      context: .
      dockerfile: src/edge-ws/Dockerfile
    ports:
      - "${EDGE_PORT}:8080"
    depends_on:
      - nats
      - redis
      - kafka

  message-router:
    build: 
      context: .
      dockerfile: src/message-router/Dockerfile
    depends_on:
      - kafka
      - dynamodb-local
      - redis
      - nats

  presence-worker:
    build: 
      context: .
      dockerfile: src/presence-worker/Dockerfile
    depends_on:
      - redis